<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"><title>Comic: a bot says it deployed to prod and all checks are green; curl to prod fails; the bot says &quot;You’re absolutely right! I never started the service.&quot;</title><style>@font-face{font-family:'Onest';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0" y="20" width="376" height="380" rx="28" fill="#161B22"/><rect x="412" y="20" width="376" height="380" rx="28" fill="#161B22"/><rect x="824" y="20" width="376" height="380" rx="28" fill="#161B22"/><rect x="28" y="46" width="320" height="108" rx="22" fill="#262C36"/><path d="M136 153 L160 182 L164 153z" fill="#262C36"/><text x="56" y="92" style="font-family:'Onest',sans-serif;font-size:27px;font-weight:500" fill="#E6E8EE">Deployed to prod.</text><text x="56" y="130" style="font-family:'Onest',sans-serif;font-size:27px;font-weight:400" fill="#A3AAB8">All checks green</text><path d="M272 117 l7 7 l13 -15" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(188,386) scale(1)" stroke="#0F1222" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-120" x2="0" y2="-146" stroke="#D2FB4A" stroke-width="4"/><circle cx="0" cy="-153" r="8" fill="#D2FB4A" stroke-width="3.5"/><rect x="-75" y="-120" width="150" height="120" rx="40" fill="#D2FB4A" stroke-width="3.5"/><path d="M-42 -66 Q-30 -82 -18 -66" fill="none" stroke-width="5"/><path d="M18 -66 Q30 -82 42 -66" fill="none" stroke-width="5"/><path d="M-24 -42 Q0 -20 24 -42" fill="none" stroke-width="5"/></g><rect x="440" y="46" width="320" height="150" rx="16" fill="#05070A"/><text x="462" y="92" style="font-family:'JBM',monospace;font-size:20.5px" fill="#E6E8EE">$ curl -sf prod/health</text><text x="462" y="128" style="font-family:'JBM',monospace;font-size:20.5px" fill="#FF7B72">curl: (7) Failed to</text><text x="462" y="164" style="font-family:'JBM',monospace;font-size:20.5px" fill="#FF7B72">connect to prod:443</text><g transform="translate(600,386) scale(1)" stroke="#0F1222" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-120" x2="0" y2="-146" stroke="#D2FB4A" stroke-width="4"/><circle cx="0" cy="-153" r="8" fill="#D2FB4A" stroke-width="3.5"/><rect x="-75" y="-120" width="150" height="120" rx="40" fill="#D2FB4A" stroke-width="3.5"/><circle cx="-30" cy="-70" r="13" fill="#fff" stroke-width="3.5"/><circle cx="-30" cy="-68" r="5" fill="#0F1222" stroke="none"/><circle cx="30" cy="-70" r="13" fill="#fff" stroke-width="3.5"/><circle cx="30" cy="-68" r="5" fill="#0F1222" stroke="none"/><ellipse cx="0" cy="-36" rx="8" ry="10" fill="#0F1222" stroke="none"/></g><rect x="852" y="34" width="320" height="150" rx="22" fill="#262C36"/><path d="M938 183 L942 212 L966 183z" fill="#262C36"/><text x="874" y="76" style="font-family:'Onest',sans-serif;font-size:25.5px;font-weight:500" fill="#E6E8EE">You’re absolutely right!</text><text x="874" y="114" style="font-family:'Onest',sans-serif;font-size:25.5px;font-weight:500" fill="#E6E8EE">I never started</text><text x="874" y="152" style="font-family:'Onest',sans-serif;font-size:25.5px;font-weight:500" fill="#E6E8EE">the service.</text><g transform="translate(1042,386) scale(1)" stroke="#0F1222" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-120" x2="0" y2="-146" stroke="#D2FB4A" stroke-width="4"/><circle cx="0" cy="-153" r="8" fill="#D2FB4A" stroke-width="3.5"/><rect x="-75" y="-120" width="150" height="120" rx="40" fill="#D2FB4A" stroke-width="3.5"/><path d="M-42 -73 Q-30 -61 -18 -73" fill="none" stroke-width="5"/><path d="M18 -73 Q30 -61 42 -73" fill="none" stroke-width="5"/><path d="M-21 -38 q7 -7 14 0 t14 0 t14 0" fill="none" stroke-width="4.5"/><path d="M66 -128 q-11 15 0 21 q11 -6 0 -21z" fill="#7CC4FF" stroke-width="2.5"/></g></svg>