<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 658" width="400" height="658" role="img"><title>Comic: a bot says it deployed to prod and all checks are green; curl to prod fails; the bot says &quot;You’re absolutely right! I never started the service.&quot;</title><style>@font-face{font-family:'Onest';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0" y="0" width="400" height="210" rx="26" fill="#161B22"/><rect x="0" y="224" width="400" height="210" rx="26" fill="#161B22"/><rect x="0" y="448" width="400" height="210" rx="26" fill="#161B22"/><rect x="20" y="44" width="250" height="104" rx="20" fill="#262C36"/><path d="M269 80 L292 96 L269 110z" fill="#262C36"/><text x="40" y="88" style="font-family:'Onest',sans-serif;font-size:22px;font-weight:500" fill="#E6E8EE">Deployed to prod.</text><text x="40" y="122" style="font-family:'Onest',sans-serif;font-size:22px" fill="#A3AAB8">All checks green</text><path d="M222 111 l7 7 l13 -15" fill="none" stroke="#3FB950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(338,186) scale(0.62)" stroke="#0F1222" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-120" x2="0" y2="-146" stroke="#D2FB4A" stroke-width="4"/><circle cx="0" cy="-153" r="8" fill="#D2FB4A" stroke-width="3.5"/><rect x="-75" y="-120" width="150" height="120" rx="40" fill="#D2FB4A" stroke-width="3.5"/><path d="M-42 -66 Q-30 -82 -18 -66" fill="none" stroke-width="5"/><path d="M18 -66 Q30 -82 42 -66" fill="none" stroke-width="5"/><path d="M-24 -42 Q0 -20 24 -42" fill="none" stroke-width="5"/></g><rect x="20" y="260" width="260" height="128" rx="14" fill="#05070A"/><text x="36" y="300" style="font-family:'JBM',monospace;font-size:16.5px" fill="#E6E8EE">$ curl -sf prod/health</text><text x="36" y="330" style="font-family:'JBM',monospace;font-size:16.5px" fill="#FF7B72">curl: (7) Failed to</text><text x="36" y="360" style="font-family:'JBM',monospace;font-size:16.5px" fill="#FF7B72">connect to prod:443</text><g transform="translate(340,410) scale(0.62)" stroke="#0F1222" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-120" x2="0" y2="-146" stroke="#D2FB4A" stroke-width="4"/><circle cx="0" cy="-153" r="8" fill="#D2FB4A" stroke-width="3.5"/><rect x="-75" y="-120" width="150" height="120" rx="40" fill="#D2FB4A" stroke-width="3.5"/><circle cx="-30" cy="-70" r="13" fill="#fff" stroke-width="3.5"/><circle cx="-30" cy="-68" r="5" fill="#0F1222" stroke="none"/><circle cx="30" cy="-70" r="13" fill="#fff" stroke-width="3.5"/><circle cx="30" cy="-68" r="5" fill="#0F1222" stroke="none"/><ellipse cx="0" cy="-36" rx="8" ry="10" fill="#0F1222" stroke="none"/></g><rect x="20" y="478" width="262" height="140" rx="20" fill="#262C36"/><path d="M281 534 L304 550 L281 564z" fill="#262C36"/><text x="38" y="520" style="font-family:'Onest',sans-serif;font-size:22px;font-weight:500" fill="#E6E8EE">You’re absolutely</text><text x="38" y="552" style="font-family:'Onest',sans-serif;font-size:22px;font-weight:500" fill="#E6E8EE">right! I never started</text><text x="38" y="584" style="font-family:'Onest',sans-serif;font-size:22px;font-weight:500" fill="#E6E8EE">the service.</text><g transform="translate(342,634) scale(0.62)" stroke="#0F1222" stroke-linecap="round" stroke-linejoin="round"><line x1="0" y1="-120" x2="0" y2="-146" stroke="#D2FB4A" stroke-width="4"/><circle cx="0" cy="-153" r="8" fill="#D2FB4A" stroke-width="3.5"/><rect x="-75" y="-120" width="150" height="120" rx="40" fill="#D2FB4A" stroke-width="3.5"/><path d="M-42 -73 Q-30 -61 -18 -73" fill="none" stroke-width="5"/><path d="M18 -73 Q30 -61 42 -73" fill="none" stroke-width="5"/><path d="M-21 -38 q7 -7 14 0 t14 0 t14 0" fill="none" stroke-width="4.5"/><path d="M66 -128 q-11 15 0 21 q11 -6 0 -21z" fill="#7CC4FF" stroke-width="2.5"/></g></svg>